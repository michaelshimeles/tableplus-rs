[package]
name = "tableplus-core"
description = "Database drivers, SQL generation and persistence for tableplus-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "unbounded_depth"] }
tracing.workspace = true
async-trait = "0.1"
futures-util = "0.3"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
csv = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Passwords live in the macOS Keychain. Other platforms fall back to a 0600 file in the
# config directory (see `secrets.rs`) so the app builds and runs on headless Linux too.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[dev-dependencies]
anyhow.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
